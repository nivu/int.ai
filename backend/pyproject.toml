[project]
name = "int-ai-backend"
version = "0.1.0"
description = "Backend for int.ai - AI-powered interview platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "celery[redis]",
    "redis",
    "pydantic-settings",
    "sentence-transformers",
    "pdfplumber",
    "python-docx",
    "livekit-agents",
    "livekit-plugins-deepgram",
    "livekit-plugins-openai>=1.5.1",
    "livekit-plugins-silero",
    "resend",
    "supabase",
    "python-dotenv",
    "email-validator>=2.3.0",
    "openai>=2.30.0",
    "schedule>=1.2.0",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["**/*"]

[tool.ruff]
# Pin the language target explicitly rather than inferring it from
# requires-python, so linting does not shift when that changes.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Ruff's *default* rule set is not stable across releases. Without this block
# CI linted against whatever the newest ruff happened to enable, which meant a
# ruff release could turn main red with no code change. Select explicitly.
#
#   E4/E7/E9, F  pyflakes + core pycodestyle (the documented default)
#   I            import sorting
#   UP           pyupgrade — keep syntax current with target-version
select = ["E4", "E7", "E9", "F", "I", "UP"]

ignore = [
    # UP042: EmailTemplate(str, Enum) -> StrEnum. Ruff marks this fix unsafe and
    # it is: app/api/email.py:165 interpolates the member into an error message,
    # which renders "EmailTemplate.rejection" today and would become "rejection"
    # under StrEnum. A deliberate change, not a lint cleanup.
    "UP042",
]

# Deliberately not enabled yet. Together these flag ~20 findings in app/ that
# need judgement, not autofixes, and several look like real latent bugs:
#   BLE001   blind `except Exception` (14x)
#   S110     try/except/pass swallowing errors (3x)
#   ASYNC230 blocking open() inside async (1x)
#   ASYNC220 subprocess spawn inside async (1x)
#   SIM102   collapsible if (1x)
# Worth a dedicated pass over error handling in the interview agent.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
