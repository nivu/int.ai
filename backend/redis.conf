# Redis configuration for interview session state persistence
# Bug 7 fix: Enable persistence to prevent session state loss on Redis crash

# Bind to localhost only (security)
bind 127.0.0.1

# Port
port 6379

# Enable AOF (Append-Only File) persistence for durability
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy: everysec balances performance and durability
# - always: fsync after every write (slowest, most durable)
# - everysec: fsync once per second (good balance)
# - no: let OS decide when to fsync (fastest, least durable)
appendfsync everysec

# Enable RDB snapshots as backup
save 900 1      # Save if at least 1 key changed in 900 seconds (15 minutes)
save 300 10     # Save if at least 10 keys changed in 300 seconds (5 minutes)
save 60 10000   # Save if at least 10000 keys changed in 60 seconds

# RDB filename
dbfilename dump.rdb

# Working directory for persistence files
dir /var/lib/redis

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Enable protected mode
protected-mode yes

# Timeout for idle clients (0 = disabled)
timeout 0

# TCP keepalive
tcp-keepalive 300

# Databases
databases 16

# Replication (if using master-slave setup)
# replicaof <masterip> <masterport>

# Security
# requirepass <your-strong-password-here>

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100
